name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-x86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential perl
    - name: Compile and Run Tests (Runtime SIMD Dispatch + Multi-Backend Sweep)
      run: make check
    - name: Address and Undefined Behavior Sanitizers
      run: make check-asan
    - name: Embedded Freestanding Verification
      run: make check-embedded

  ci-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential perl
    - name: Compile and Run Tests (ARM64 NEON)
      run: make check
    - name: Embedded Freestanding Verification
      run: make check-embedded

  ci-riscv64-rvv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user qemu-user-binfmt gcc-riscv64-linux-gnu libc6-dev-riscv64-cross perl
    - name: Compile and Run Tests (RISC-V Vector Emulated)
      env:
        QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
      run: |
        make CC=riscv64-linux-gnu-gcc CFLAGS="-Wall -Wextra -O3 -std=c99 -march=rv64gcv -mabi=lp64d" check
